name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Smoke test the server
        run: |
          export CANVAS_PORT=4488
          export CANVAS_DATA_DIR="$RUNNER_TEMP/canvases"
          export CANVAS_EVENTS_FILE="$RUNNER_TEMP/ui-events.json"
          bun start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:4488/" > /dev/null && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:4488/" > /dev/null
          curl -fsS "http://127.0.0.1:4488/api/canvases" > /dev/null
          echo "server is up"

      - name: Server log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
